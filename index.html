<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AdmitIQ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f0e8;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    #chat {
      margin-top: 20px;
    }
    .msg {
      margin: 10px 0;
    }
    .user { color: blue; }
    .ai { color: green; }
  </style>
</head>
<body>

<div class="container">
  <h2>AdmitIQ – AI Student Screening</h2>

  <input id="userInput" placeholder="Type your response..." />
  <button onclick="sendMessage()">Send</button>

  <div id="chat"></div>
</div>

<script>
const WORKER_URL = "https://crimson-field-90b7.hxmjgnw4vd.workers.dev/";

let messages = [];

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessage("user", text);
  input.value = "";

  messages.push({ role: "user", content: text });

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    let reply = "Something went wrong";

    // ✅ SAFE RESPONSE HANDLING (fixes your error)
    if (data && data.choices && data.choices.length > 0) {
      reply = data.choices[0].message.content;
    } else if (data.error) {
      reply = "Error: " + data.error;
    }

    addMessage("ai", reply);
    messages.push({ role: "assistant", content: reply });

  } catch (err) {
    addMessage("ai", "Error connecting to AI");
    console.error(err);
  }
}

function addMessage(role, text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = (role === "user" ? "You: " : "AI: ") + text;
  chat.appendChild(div);
}
</script>

</body>
</html>
